apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: directus
spec:
  ingressClassName: traefik
  rules:
    - host: directus.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: directus
                port:
                  name: http
