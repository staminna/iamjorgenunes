apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iamjorgenunes

labels:
  - pairs:
      app.kubernetes.io/part-of: iamjorgenunes
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - directus

# O nome final leva um hash do conteúdo (nginx-conf-<hash>). Mudar o
# default.conf gera um ConfigMap novo e dispara um rolling update sozinho.
configMapGenerator:
  - name: nginx-conf
    files:
      - nginx/default.conf
      - nginx/security-headers.inc

images:
  - name: iamjorgenunes-web
    newTag: dev
