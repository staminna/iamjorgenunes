apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # nunca menos réplicas prontas do que o pedido
  selector:
    matchLabels:
      app.kubernetes.io/name: iamjorgenunes
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iamjorgenunes
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false # o nginx não fala com a API do K8s
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: iamjorgenunes-web:dev
          imagePullPolicy: IfNotPresent # imagem carregada com `kind load`
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi # sem limite de CPU de propósito: evita throttling
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp # pid, client_body_temp, proxy_temp…
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf # kustomize acrescenta o hash do conteúdo
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
