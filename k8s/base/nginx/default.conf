# Montado pelo ConfigMap em /etc/nginx/conf.d/ — muda-se sem rebuild da imagem.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Atrás do Ingress: redirects relativos, para não vazar a porta 8080.
    absolute_redirect off;
    server_tokens     off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml
                    application/xml text/xml text/plain;

    # Probes do Kubernetes — sem log, sem ficheiro.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash do Astro: cache longa e imutável.
    location /_astro/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # trailingSlash = always no Astro: /about -> 301 relativo para /about/
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/conf.d/security-headers.inc;
        internal;
    }
}
