# Site Configuration
[site]
  title            = "Jorge Nunes"
  description      = "Platform and DevOps engineer with 12+ years of experience running production systems end to end — AWS, Terraform, Ansible, Kubernetes, CI/CD, DevSecOps and OAuth2 / OIDC."
  tagline          = "Platform & Delivery Engineering"
  taglineSeparator = " · "
  baseUrl          = "https://iamjorgenunes.com"
  logo             = "/images/logo.svg"
  logoAlternate    = "/images/logo-light.svg"
  logoText         = "Jorge Nunes"
  logoWidth        = "0px"
  logoHeight       = "0px"

  trailingSlash = true

  [site.favicon]
    path  = "/images/favicons"
    image = "/images/favicon.png"


# SEO Metadata
# -----------------------------------------------------------------------------------------------------------------------------------
[seo]
  author = "Jorge Domingues Nunes"
  keywords = [
    "Jorge Nunes",
    "Jorge Domingues Nunes",
    "Platform Engineer",
    "DevOps Engineer",
    "DevSecOps Engineer",
    "Site Reliability Engineer",
    "Cloud Engineer",
    "AWS",
    "ECS Fargate",
    "Terraform",
    "Ansible",
    "Kubernetes",
    "Helm",
    "Docker",
    "CI/CD",
    "GitHub Actions",
    "GitLab",
    "Jenkins",
    "OAuth2",
    "OpenID Connect",
    "Linux",
    "Red Hat",
    "Nginx",
    "PostgreSQL",
    "Go",
    "Python",
    "Bash",
    "MCP",
    "Model Context Protocol",
    "Pombal Portugal",
    "remote EU",
    "Brussels",
  ]
  robots = "index, follow"

  [seo.robotsTxt]
    enable = true
    disallow = [
      "/_astro/",
      "/cdn-cgi/",
    ]

  [seo.sitemap]
    enable  = true
    exclude = []


# Theme settings
# -----------------------------------------------------------------------------------------------------------------------------------
[settings]
  blogFolder      = "blog"
  servicesFolder  = "services"
  portfolioFolder = "portfolio"

  stickyHeader = true

  contactFormAction   = "https://formsubmit.co/stamina.nunes@gmail.com"
  contactFormProvider = "formsubmit.co"

  footerDescription = "Platform & Delivery Engineering · AWS · Terraform · Kubernetes · CI/CD · DevSecOps · Three years inside the European Central Bank; CI/CD at the European Commission; led the Bureau Veritas pipeline audit that unlocked €2.5M at Co2Offset.ai."

  [settings.copyright]
    enable = true
    text   = "Copyright © {{ year }} Jorge Nunes. Built with Astro on the [Folex Lite](https://github.com/getastrothemes/folex-lite-astro) theme."

  [settings.multilingual]
    enable               = false
    defaultLanguage      = "en"
    disableLanguages     = ["fr"]
    showDefaultLangInUrl = false

  [settings.contactInfo]
    address = "Pombal, Portugal"
    email   = "[stamina.nunes@gmail.com](mailto:stamina.nunes@gmail.com)"
    phone   = "[+351 914 764 120](tel:+351914764120)"

  [settings.headerOffcanvas]
    enable      = true
    logo        = "/images/logo-light.svg"
    description = "Hands-on platform and DevOps engineer with 12+ years of experience building and running production systems end to end: infrastructure, delivery pipelines, security and the services on top."

    [settings.headerOffcanvas.button]
      enable = true
      label  = "Download CV"
      url    = "/cv/Jorge_Nunes_CV.pdf"

[settings.navigationButton]
  enable = true
  label  = "Get in touch"
  url    = "#contact"


# OpenGraph Metadata
# -----------------------------------------------------------------------------------------------------------------------------------
[opengraph]
  image       = "/images/og-image.jpg"
  ogLocale    = "en_US"
  ogType      = "website"
  twitter     = ""
  twitterCard = "summary_large_image"

# [head]
# -----------------------------------------------------------------------------------------------------------------------------------
[head]
  content = ""
