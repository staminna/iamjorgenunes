# Site Configuration
[site]
  title            = "Jorge Nunes"
  description      = "Senior Directus & full-stack engineer with 12+ years of experience: headless platforms on the latest Directus, Visual Editor, Next.js / React, Monospace and AI agents via MCP."
  tagline          = "Senior Directus Engineer"
  taglineSeparator = " · "
  baseUrl          = "https://iamjorgenunes.com"
  logo             = "/images/logo.svg"
  logoAlternate    = "/images/logo-light.svg"
  logoText         = "Jorge Nunes"
  logoWidth        = "0px"
  logoHeight       = "0px"

  trailingSlash = true

  [site.favicon]
    path  = "/images/favicons"
    image = "/images/favicon.png"


# SEO Metadata
# -----------------------------------------------------------------------------------------------------------------------------------
[seo]
  author = "Jorge Domingues Nunes"
  keywords = [
    "Jorge Nunes",
    "Jorge Domingues Nunes",
    "Senior Directus Engineer",
    "Directus developer",
    "Directus Visual Editor",
    "Monospace",
    "Senior AI Engineer",
    "AI engineer",
    "agentic AI",
    "MCP",
    "Model Context Protocol",
    "LangChain",
    "LangGraph",
    "RAG",
    "Python",
    "FastAPI",
    "React",
    "TypeScript",
    "Kubernetes",
    "Terraform",
    "AI-assisted development",
    "Pombal Portugal",
    "remote EU",
  ]
  robots = "index, follow"

  [seo.robotsTxt]
    enable = true
    disallow = [
      "/_astro/",
      "/cdn-cgi/",
    ]

  [seo.sitemap]
    enable  = true
    exclude = []


# Theme settings
# -----------------------------------------------------------------------------------------------------------------------------------
[settings]
  blogFolder      = "blog"
  servicesFolder  = "services"
  portfolioFolder = "portfolio"

  stickyHeader = true

  contactFormAction   = "https://formsubmit.co/stamina.nunes@gmail.com"
  contactFormProvider = "formsubmit.co"

  footerDescription = "Senior Directus Engineer · Headless platforms · Next.js · Agents & MCP · Secure delivery for the European Central Bank and the European Commission."

  [settings.copyright]
    enable = true
    text   = "Copyright © {{ year }} Jorge Nunes. Built with Astro on the [Folex Lite](https://github.com/getastrothemes/folex-lite-astro) theme."

  [settings.multilingual]
    enable               = false
    defaultLanguage      = "en"
    disableLanguages     = ["fr"]
    showDefaultLangInUrl = false

  [settings.contactInfo]
    address = "Pombal, Portugal"
    email   = "[stamina.nunes@gmail.com](mailto:stamina.nunes@gmail.com)"
    phone   = "[+351 914 764 120](tel:+351914764120)"

  [settings.headerOffcanvas]
    enable      = true
    logo        = "/images/logo-light.svg"
    description = "Senior AI & full-stack engineer with over 12 years of experience building agentic AI and Directus headless platforms and shipping secure systems for restricted environments."

    [settings.headerOffcanvas.button]
      enable = true
      label  = "Download CV"
      url    = "/cv/Jorge_Nunes_CV.pdf"

[settings.navigationButton]
  enable = true
  label  = "Get in touch"
  url    = "#contact"


# OpenGraph Metadata
# -----------------------------------------------------------------------------------------------------------------------------------
[opengraph]
  image       = "/images/og-image.jpg"
  ogLocale    = "en_US"
  ogType      = "website"
  twitter     = ""
  twitterCard = "summary_large_image"

# [head]
# -----------------------------------------------------------------------------------------------------------------------------------
[head]
  content = ""
